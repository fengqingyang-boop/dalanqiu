<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 篮球游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      cursor: default;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
      outline: none;
    }

    /* 蓄力条 */
    #power-bar-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 30px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #fff;
      border-radius: 15px;
      overflow: hidden;
      display: none;
      z-index: 100;
    }

    #power-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00ff00, #ffff00, #ff6600, #ff0000);
      transition: width 0.016s linear;
    }

    #power-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      font-size: 14px;
      pointer-events: none;
    }

    /* 瞄准指示器 */
    #aim-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 3px solid #ff6600;
      border-radius: 50%;
      pointer-events: none;
      display: none;
      z-index: 100;
    }

    /* 操作说明 */
    #controls-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      z-index: 100;
      border: 1px solid #ff6600;
    }

    #controls-panel h3 {
      color: #ff6600;
      margin-bottom: 10px;
      font-size: 16px;
    }

    #controls-panel p {
      margin: 5px 0;
    }

    #controls-panel .key {
      background: #ff6600;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      margin-right: 5px;
    }

    /* 游戏状态 */
    #game-status {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 20px;
      border-radius: 10px;
      color: #fff;
      z-index: 100;
      border: 1px solid #00ff00;
    }

    #score {
      font-size: 24px;
      font-weight: bold;
      color: #00ff00;
    }

    #score-label {
      font-size: 12px;
      color: #aaa;
    }

    /* 扣篮提示 */
    #dunk-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 102, 0, 0.9);
      padding: 20px 40px;
      border-radius: 10px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      z-index: 100;
      display: none;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* 点击开始提示 */
    #start-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 30px 50px;
      border-radius: 15px;
      color: #fff;
      text-align: center;
      z-index: 200;
      border: 2px solid #ff6600;
    }

    #start-hint h1 {
      color: #ff6600;
      margin-bottom: 20px;
      font-size: 32px;
    }

    #start-hint p {
      margin: 10px 0;
      font-size: 16px;
    }

    #start-hint button {
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 18px;
      background: #ff6600;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #start-hint button:hover {
      background: #ff8833;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="start-hint">
      <h1>🏀 3D 篮球游戏</h1>
      <p>体验真实的篮球物理！</p>
      <p>点击下方按钮开始游戏</p>
      <button id="start-btn">开始游戏</button>
    </div>

    <div id="power-bar-container">
      <div id="power-bar"></div>
      <div id="power-label">蓄力中...</div>
    </div>

    <div id="aim-indicator"></div>

    <div id="controls-panel">
      <h3>操作说明</h3>
      <p><span class="key">点击游戏画面</span> 进入控制模式</p>
      <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动</p>
      <p><span class="key">鼠标移动</span> 转动视角</p>
      <p><span class="key">鼠标左键</span> 按住瞄准蓄力，松开投篮</p>
      <p><span class="key">空格</span> 拍球</p>
      <p><span class="key">Q</span> 篮筐下扣篮</p>
      <p><span class="key">ESC</span> 退出控制模式</p>
    </div>

    <div id="game-status">
      <div id="score-label">得分</div>
      <div id="score">0</div>
    </div>

    <div id="dunk-hint">
      按 Q 扣篮！
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
